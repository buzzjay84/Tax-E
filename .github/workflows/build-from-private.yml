name: Build Release from private source

# Lives in the PUBLIC release repo (buzzjay84/Tax-E), not in the private source repo. Actions on a
# public repository are free, so the installers are built here. The private source
# (jaybhee84/Tax-E) is checked out read-only with a deploy key, tested, built, and the installers
# are published to THIS repo's Releases.
#
# Start it from the private repo's machine (no Actions needed there):
#   gh workflow run build-from-private.yml -R buzzjay84/Tax-E -f tag=v1.0.0 -f ref=main
# or from the Actions tab of this repo ("Run workflow").

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to publish, e.g. v1.0.0 (must equal package.json version at ref)'
        required: true
        type: string
      ref:
        description: 'Branch, tag or commit of the private source to build (default: the tag)'
        required: false
        type: string
  repository_dispatch:
    types: [build-release]

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.event.inputs.tag || github.event.client_payload.tag }}
  cancel-in-progress: false

env:
  SOURCE_REPO: jaybhee84/Tax-E
  RELEASE_TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
  SOURCE_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || github.event.inputs.tag || github.event.client_payload.tag }}

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Tag must look like vX.Y.Z
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag like v1.0.0" >&2
            exit 1
          fi

  build-windows:
    needs: check-tag
    runs-on: windows-latest
    steps:
      # Read-only deploy key for the private repo. The key is never printed and no credentials are
      # left in the workspace. Logs of a public repo are public, so nothing here echoes source.
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Tag $env:RELEASE_TAG must match package.json version $packageVersion."
          }

      # npm ci runs postinstall (electron-builder install-app-deps), which fetches the encrypted
      # SQLite driver built for Electron on this platform.
      - run: npm ci
      - run: npm test

      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --win nsis --publish always

  build-macos:
    needs: check-tag
    runs-on: macos-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $RELEASE_TAG must match package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test

      # No Apple certificate: unsigned, unnotarized DMGs (right-click > Open the first time).
      # --x64 and --arm64 are both required to get both DMGs from one run; the SQLite driver is
      # rebuilt for each architecture.
      - name: Build and publish macOS DMGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist -- --mac dmg --x64 --arm64 --publish always

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "${{ github.repository }}"
